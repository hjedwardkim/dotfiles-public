onboarding = false

[[keys.command]]
key = "prefix+a"
type = "popup"
command = "read -rp 'agent name: ' n && spawn-agent \"$n\""
description = "spawn a sandboxed agent in a new worktree"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+shift+a"
type = "popup"
command = "read -rp 'agent name: ' n && spawn-agent -a omp \"$n\""
description = "spawn a sandboxed omp agent in a new worktree"
width = "60%"
height = "30%"

[[keys.command]]
key = "prefix+d"
type = "popup"
command = "reap-agent; read -rp 'press enter' _"
description = "reap the focused agent's worktree and sandbox"
width = "60%"
height = "40%"

[[keys.command]]
key = "prefix+f"
type = "popup"
command = "read -rp 'tab name: ' n && fork-claude \"$n\""
description = "fork the focused claude session into a new tab"
width = "60%"
height = "20%"

[ui]
status_indicators = "symbols"
show_agent_labels_on_pane_borders = true

[theme]
name = "tokyo-night"

[theme.custom]
active_row_bg = "#2c324a"
subtext0 = "#c0caf5"
text = "#c0caf5"
overlay0 = "#9aa5ce"
overlay1 = "#a9b1d6"
